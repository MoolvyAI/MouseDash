<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MouseDash</title>
<style>
  * { box-sizing: border-box; }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f0f0;
    margin: 0;
    font-family: Arial, sans-serif;
    user-select: none;
  }
  
  #gameContainer {
    position: relative;
    width: min(85vmin, 500px);
    height: min(85vmin, 500px);
    background-color: #fff;
    border: 2px solid #333;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    cursor: crosshair;
  }
  
  #player {
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: #000;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
  }
  
  .obstacle {
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: #888;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  
  #topBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: min(85vmin, 500px);
    margin-bottom: 10px;
  }

  .difficulty-btn {
    padding: 6px 12px;
    border: 1px solid #333;
    background: #fff;
    cursor: pointer;
    font-weight: bold;
  }

  .difficulty-btn.active {
    background: #333;
    color: #fff;
  }
  
  #score {
    font-size: 18px;
    font-weight: bold;
  }
  
  #instructions {
    margin-top: 10px;
    color: #666;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="topBar">
  <div id="score">Score: 0.0s</div>
  <div>
    <button class="difficulty-btn" onclick="setDifficulty('easy')">Easy</button>
    <button class="difficulty-btn active" id="btn-medium" onclick="setDifficulty('medium')">Medium</button>
    <button class="difficulty-btn" onclick="setDifficulty('hard')">Hard</button>
  </div>
</div>

<div id="gameContainer">
  <div id="player"></div>
</div>

<div id="instructions">Enter the room to start the game.</div>

<script>
  const gameContainer = document.getElementById('gameContainer');
  const player = document.getElementById('player');
  const scoreElement = document.getElementById('score');
  
  let score = 0;
  let gameRunning = false;
  let difficulty = 'medium';
  let animationFrameId;
  let scoreInterval;
  let spawnInterval;
  let obstacles = [];
  let playerPos = { x: -100, y: -100 };
  
  const settings = {
    easy: { count: 12, speed: 1.5, spawnRate: 800 },
    medium: { count: 20, speed: 2.5, spawnRate: 500 },
    hard: { count: 32, speed: 4.0, spawnRate: 300 }
  };

  function setDifficulty(level) {
    if (gameRunning) return;
    difficulty = level;
    document.querySelectorAll('.difficulty-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.toLowerCase() === level);
    });
  }

  function startGame() {
    if (gameRunning) return;
    gameRunning = true;
    score = 0;
    obstacles.forEach(o => o.el.remove());
    obstacles = [];
    const startTime = Date.now();
    scoreInterval = setInterval(() => {
      score = (Date.now() - startTime) / 1000;
      scoreElement.textContent = `Score: ${score.toFixed(1)}s`;
    }, 100);
    spawnInterval = setInterval(() => {
      if (obstacles.length < settings[difficulty].count) {
        spawnObstacle();
      }
    }, settings[difficulty].spawnRate);
    gameLoop();
  }

  function spawnObstacle() {
    const el = document.createElement('div');
    el.classList.add('obstacle');
    let x, y;
    do {
      x = Math.random() * gameContainer.clientWidth;
      y = Math.random() * gameContainer.clientHeight;
    } while (Math.hypot(x - playerPos.x, y - playerPos.y) < 80);

    gameContainer.appendChild(el);

    const speed = settings[difficulty].speed;
    const angle = Math.random() * Math.PI * 2;
    
    obstacles.push({
      el: el,
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: 10
    });
  }

  function gameLoop() {
    if (!gameRunning) return;

    const width = gameContainer.clientWidth;
    const height = gameContainer.clientHeight;
    for (let obs of obstacles) {
      obs.x += obs.vx;
      obs.y += obs.vy;
      if (obs.x - obs.radius <= 0 || obs.x + obs.radius >= width) obs.vx *= -1;
      if (obs.y - obs.radius <= 0 || obs.y + obs.radius >= height) obs.vy *= -1;
      obs.el.style.left = `${obs.x}px`;
      obs.el.style.top = `${obs.y}px`;
      const dist = Math.hypot(obs.x - playerPos.x, obs.y - playerPos.y);
      if (dist < 20) {
        gameOver();
        return;
      }
    }

    animationFrameId = requestAnimationFrame(gameLoop);
  }

  function gameOver() {
    gameRunning = false;
    clearInterval(scoreInterval);
    clearInterval(spawnInterval);
    cancelAnimationFrame(animationFrameId);
    alert(`Game Over! Your result: ${score.toFixed(1)} seconds.`);
  }

  gameContainer.addEventListener('mousemove', (e) => {
    const rect = gameContainer.getBoundingClientRect();
    playerPos.x = e.clientX - rect.left;
    playerPos.y = e.clientY - rect.top;
    
    player.style.left = `${playerPos.x}px`;
    player.style.top = `${playerPos.y}px`;

    if (!gameRunning) {
      startGame();
    }
  });

  gameContainer.addEventListener('mouseleave', () => {
    if (gameRunning) gameOver();
  });
</script>
</body>
</html>
